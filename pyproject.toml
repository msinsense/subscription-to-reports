[project]
name = "subscription-to-reports"
version = "0.1.0"
description = "Migrate Sisense dashboard subscriptions to Report Manager reports using only the REST API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pysisense>=1.0.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=main --cov-report=term-missing"
